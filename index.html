<!DOCTYPE html>

<html lang="no">
<head>
<meta charset="utf-8"/>

<script crossorigin="" src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

<!-- Statistikk til GoatCounter -->

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="styles/app.css" rel="stylesheet"/></head>
<body>
<div id="root"></div>
<script>
  // Starter ikke appen (f.eks. fordi nettleseren blander gamle og nye filer etter en oppdatering),
  // vis en melding i stedet for en blank side.
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (!root || root.childElementCount > 0) return;
    root.innerHTML = '<div style="max-width:560px;margin:15vh auto;padding:0 16px;font-family:system-ui,sans-serif;line-height:1.5">' +
      '<h1 style="font-size:20px">Appen kunne ikke starte</h1>' +
      '<p>Last siden på nytt med Ctrl+F5 (Cmd+Shift+R på Mac). Hjelper ikke det, kan du melde fra på ' +
      '<a href="https://github.com/jahili/helsestatistikk/issues">GitHub</a>.</p>' +
      '<p style="color:#5B6764;font-size:13px"></p></div>';
    root.querySelector('p:last-child').textContent = 'Feil: ' + (e.message || 'ukjent');
  });
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
